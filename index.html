<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PT Session Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      text-align: center;
    }
    .header h1 {
      margin: 0 0 6px 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .counter-card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .count-display {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
      color: var(--accent);
    }
    .count-subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }
    .pills {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 28px;
    }
    .pill {
      width: 32px;
      height: 8px;
      border-radius: 4px;
      background: #334155;
      transition: background-color 0.25s ease;
    }
    .pill.filled {
      background: var(--accent);
    }
    .btn-log {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    .btn-log:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
    .btn-log:disabled {
      background: #334155;
      color: var(--muted);
      cursor: not-allowed;
    }
    .history-card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .history-card h2 {
      margin: 0 0 14px 0;
      font-size: 1.05rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-reset {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .session-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .session-item span:first-child {
      font-weight: 600;
      color: var(--text);
    }
    .session-item span:last-child {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>PT Session Tracker</h1>
      <p>Track your 8-session block</p>
    </div>

    <div class="counter-card">
      <div class="count-display" id="remainingCount">8</div>
      <div class="count-subtitle" id="statusText">Sessions Left</div>
      <div class="pills" id="pillContainer"></div>
      <button class="btn-log" id="logBtn" onclick="logSession()">Log Today's Session</button>
    </div>

    <div class="history-card">
      <h2>
        <span>History</span>
        <button class="btn-reset" onclick="resetBlock()">Reset (New Block)</button>
      </h2>
      <ul class="session-list" id="sessionList"></ul>
    </div>
  </div>

  <script>
    const TOTAL_SESSIONS = 8;
    const STORAGE_KEY = 'pt_sessions_log';

    function getSessions() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveSessions(sessions) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      render();
    }

    function logSession() {
      const sessions = getSessions();
      if (sessions.length >= TOTAL_SESSIONS) return;

      const now = new Date();
      const formattedDate = now.toLocaleDateString('en-GB', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      sessions.push({
        number: sessions.length + 1,
        timestamp: formattedDate
      });

      saveSessions(sessions);
    }

    function resetBlock() {
      if (confirm('Start a new 8-session block? This will clear current session dates.')) {
        saveSessions([]);
      }
    }

    function render() {
      const sessions = getSessions();
      const count = sessions.length;
      const remaining = Math.max(0, TOTAL_SESSIONS - count);

      document.getElementById('remainingCount').innerText = remaining;
      document.getElementById('statusText').innerText = remaining === 0 
        ? 'Block Complete!' 
        : `${count} of ${TOTAL_SESSIONS} completed`;

      const logBtn = document.getElementById('logBtn');
      logBtn.disabled = remaining === 0;
      logBtn.innerText = remaining === 0 ? 'Block Finished' : '+ Tap to Register Session';

      const pillContainer = document.getElementById('pillContainer');
      pillContainer.innerHTML = '';
      for (let i = 0; i < TOTAL_SESSIONS; i++) {
        const pill = document.createElement('div');
        pill.className = `pill ${i < count ? 'filled' : ''}`;
        pillContainer.appendChild(pill);
      }

      const listContainer = document.getElementById('sessionList');
      listContainer.innerHTML = '';
      if (sessions.length === 0) {
        listContainer.innerHTML = '<div class="empty-msg">No sessions logged yet.</div>';
      } else {
        sessions.slice().reverse().forEach(s => {
          const li = document.createElement('li');
          li.className = 'session-item';
          li.innerHTML = `<span>Session #${s.number}</span><span>${s.timestamp}</span>`;
          listContainer.appendChild(li);
        });
      }
    }

    render();
  </script>
</body>
</html>
